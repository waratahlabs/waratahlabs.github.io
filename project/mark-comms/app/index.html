    --accent: #ff6a2b; --accent-ink: #160a04;

}
:root[data-theme="dark"] {

  const cap = st.cap && Date.now() - st.capAt < 5000 && captureSelection() || (st.cap && Date.now() - st.capAt < 5000 ? st.cap : null);
  if (!cap) { toast("Select some text in the draft first"); return; }
  st.pending = cap; st.cap = null; st.replyTo = st.editing = null; getSelection().removeAllRanges(); positionFab(null);
  $("#app").classList.add("rail-open"); paint(); renderRail();
}
for (const id of ["#fab", "#commentBtn"]) { const b = $(id); b.addEventListener("pointerdown", (e) => e.preventDefault()); b.addEventListener("mousedown", (e) => e.preventDefault()); b.addEventListener("click", startComment); }
$("#doc").addEventListener("click", (e) => {
  const mk = e.target.closest("mark.hl"); if (!mk || (getSelection() && !getSelection().isCollapsed)) return;
  const ids = mk.dataset.ids.split(" ").filter((x) => x !== "pending"); if (ids.length) { $("#app").classList.add("rail-open"); focusComment(ids[0], false); }
});

/* ============ files ============ */
let guardAt = 0;
function guard(fn) { if (!st.dirty || Date.now() - guardAt < 4000) { guardAt = 0; fn(); return; } guardAt = Date.now(); toast("Unsaved comments. Press again to discard them."); }
async function openFile() {
  guard(async () => {
    if (window.showOpenFilePicker) {
      try { const [fh] = await showOpenFilePicker({ types: [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown"], "text/plain": [".txt"] } }] }); const f = await fh.getFile(); load(f.name, await f.text(), fh); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    $("#file").click();
  });
}
$("#file").addEventListener("change", async (e) => { const f = e.target.files[0]; if (f) load(f.name, await f.text(), null); e.target.value = ""; });
async function saveFile() {
  const text = serialize(); if (serialize.skipped) toast(serialize.skipped + " anchor(s) crossed formatting; their notes are saved without inline tags");
  if (st.handle) { try { const w = await st.handle.createWritable(); await w.write(text); await w.close(); st.dirty = false; renderHead(); persist(); toast("Saved " + st.name); return; } catch (e) { st.handle = null; } }
  if (window.showSaveFilePicker) { try { const fh = await showSaveFilePicker({ suggestedName: st.name, types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }] }); const w = await fh.createWritable(); await w.write(text); await w.close(); st.handle = fh; st.name = fh.name; st.dirty = false; renderHead(); persist(); toast("Saved " + st.name); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })), download: st.name }); document.body.append(a); a.click(); a.remove();
  st.dirty = false; renderHead(); persist(); toast("Downloaded " + st.name + ". Use Copy .md if nothing arrived.");
}
async function copyMd() {
  const text = serialize();
  try { await navigator.clipboard.writeText(text); toast("Copied markdown with comments"); }
  catch (e) { const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast("Copied markdown with comments"); } catch (e2) { toast("Copy blocked by this browser"); } ta.remove(); }
}
$("#openBtn").addEventListener("click", openFile);
$("#saveBtn").addEventListener("click", saveFile);
$("#copyBtn").addEventListener("click", copyMd);
$("#railToggle").addEventListener("click", () => $("#app").classList.toggle("rail-open"));
$("#showResolved").addEventListener("change", (e) => { st.showResolved = e.target.checked; paint(); renderRail(); });
$("#author").value = st.author;
$("#author").addEventListener("input", (e) => { st.author = e.target.value.trim() || "Me"; store("markcomms.author", st.author); });
$("#pasteBtn").addEventListener("click", () => { $("#more").open = false; guard(() => { $("#pasteDlg").showModal(); $("#pasteText").focus(); }); });
$("#pasteCancel").addEventListener("click", () => $("#pasteDlg").close());
$("#pasteForm").addEventListener("submit", () => { const t = $("#pasteText").value; if (t.trim()) load($("#pasteName").value.trim() || "pasted.md", t, null); $("#pasteText").value = ""; });
$("#resetBtn").addEventListener("click", () => { $("#more").open = false; guard(() => { store("markcomms.draft", null); loadExample(); }); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", async (e) => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) guard(async () => load(f.name, await f.text(), null)); });
addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveFile(); } });

/* ============ example document ============ */
const EXAMPLE = `# Field notes on a draft

This is an **example document**. Select any words in it and tap *Comment* to leave a note in the margin. Notes live in the \`.md\` file itself, so the file you save can be dropped straight into an AI coding session.

## How it works

- Highlights are stored as \`[text](markcomms:ID)\` links. Files from the old Sidemarkr open too and are saved in the new format.
- Each note is also written as a footnote with its selected text, author and time.
- Opening a file that already has notes puts the highlights back.

> Quotes, [links](https://example.com) and tables render too, though the page is for reviewing, not editing.

| Where | What you do |
| --- | --- |
| Chrome or Edge | Save writes back to the file you opened |
| Other browsers | Save downloads a copy, and Copy .md puts it on the clipboard |
`;
function loadExample() {
  load("example.md", EXAMPLE, null);
  const mk = (text, body, extra) => { const r = findRange(text, 0); if (!r) return; st.comments.push({ id: uid(), parentId: null, selectedText: text, createdAt: new Date(Date.now() - (extra || 0)).toISOString(), resolved: false, orphaned: false, offset: r.ds, length: r.de - r.ds, author: "Example", body, ds: r.ds, de: r.de }); };
  mk("Files from the old Sidemarkr open too", "Example comment. Replace this file with your own draft using Open.", 120000);
  mk("Select any words in it", "Example comment. Resolve or delete these when you are done.", 60000);
  st.dirty = false; paint(); renderRail(); renderHead();
}
function boot() {
  let d = null; try { d = JSON.parse(store("markcomms.draft") || "null"); } catch (e) {}
  if (d && d.text) { load(d.name || "draft.md", d.text, null); st.dirty = !!d.dirty; renderHead(); } else loadExample();
}
window.__markcomms = { st, load, serialize, findRange, anchorOk, parseCommentsSection, stripAnchors, get docText() { return docText; } };
boot();
</script>
